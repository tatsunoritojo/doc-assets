<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OGP light">
  <title>OGP 1200×630 light</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#DBEAFE" opacity=".55"/>
  <circle cx="120" cy="560" r="180" fill="#D1FAE5" opacity=".4"/>
  <!-- safe content area guide (optional, light) -->
  <rect x="80" y="140" width="1040" height="350" rx="8" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 6" opacity=".35"/>
  <line x1="120" y1="260" x2="720" y2="260" stroke="#64748B" stroke-width="8" stroke-linecap="round" opacity=".25"/>
  <line x1="120" y1="320" x2="520" y2="320" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity=".2"/>
</svg>
