<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Browser frame">
  <title>Browser frame</title>
  <!-- window shadow -->
  <rect x="8" y="12" width="944" height="620" rx="12" fill="#0F172A" opacity=".08"/>
  <!-- shell -->
  <rect x="0" y="0" width="960" height="640" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- title bar -->
  <rect x="0" y="0" width="960" height="44" rx="12" fill="#F1F5F9"/>
  <rect x="0" y="20" width="960" height="24" fill="#F1F5F9"/>
  <!-- traffic lights -->
  <circle cx="28" cy="22" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="22" r="6" fill="#FEBC2E"/>
  <circle cx="72" cy="22" r="6" fill="#28C840"/>
  <!-- address bar -->
  <rect x="120" y="10" width="720" height="24" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="140" y="27" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748B">https://</text>
  <!-- content well (placeholder) -->
  <rect id="screen" x="12" y="52" width="936" height="576" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="340" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#94A3B8">screenshot / content</text>
</svg>
